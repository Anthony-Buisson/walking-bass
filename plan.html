<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walking Bass Plan</title>
<meta name="description" content="Plan du festival The Walking Bass : The Last Raver, avec l'artiste en train de jouer sur chaque scène.">
<meta name="theme-color" content="#0b0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Walking Bass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: "Creepster"; src: url(fonts/creepster.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Oswald"; src: url(fonts/oswald.woff2) format("woff2"); font-weight: 200 700; font-display: swap; }

/* Same tokens as index.html. The map is the official image; live badges sit on each stage, placed in % of the image. */
:root {
  --bg: #0b0d0b;
  --ink: #ece6d4;
  --muted: #9a9686;
  --arcane: #4f9e3f;
  --station: #c8312a;
  --blood: #ff5426;
  --line: rgba(236, 230, 212, .28);
  --font-title: "Creepster", "Impact", fantasy;
  --font-ui: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  color-scheme: dark;
}
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 500;
  background:
    radial-gradient(60% 55% at 0% 45%, rgba(63, 128, 50, .38), transparent 70%),
    radial-gradient(60% 55% at 100% 45%, rgba(168, 32, 24, .42), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
body::after {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); pointer-events: none;
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}

/* Title, a shorter take on the timetable's */
.title { text-align: center; line-height: .82; user-select: none; }
.title h1 {
  margin: 0; font-family: var(--font-title); font-weight: 400;
  font-size: clamp(36px, 10vw, 60px); letter-spacing: .02em;
  background: linear-gradient(180deg, #ff8a3d 0%, #ff4a24 45%, #b5170f 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #2a0503) drop-shadow(0 0 18px rgba(255, 70, 30, .25));
}
.meta { margin-top: 10px; color: var(--muted); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }

.tabs { justify-self: center; display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: rgba(0, 0, 0, .45); }
.tabs a {
  padding: 7px 20px 6px; border-radius: 999px; color: var(--muted); text-decoration: none;
  font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
}
.tabs a[aria-current="page"] { color: #1a0402; background: var(--ink); }
.tabs a:focus-visible { outline: 2px solid var(--blood); outline-offset: 2px; }

/* Map + legend: side by side when there is room, stacked on phones */
.layout { display: grid; gap: 18px; align-items: start; }
@media (min-width: 900px) { .layout { grid-template-columns: 1fr 260px; } }
.scroller { overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: #000; overscroll-behavior-x: contain; }
.map { position: relative; width: 100%; aspect-ratio: 1358 / 1110; }
.zoomed .map { width: 230%; }
/* Zoomed: the map scrolls inside a frame short enough to keep "Réduire" on screen */
.scroller.zoomed { max-height: 62vh; max-height: 62svh; }
.map img { display: block; width: 100%; height: 100%; }
.legend { width: 100%; height: auto; max-width: 230px; justify-self: center; display: block; border-radius: 6px; }
/* Same look as the timetable's install button, centred so it stays clear of the screen edge */
.zoom {
  justify-self: center; margin-top: 6px; display: inline-flex; align-items: center; gap: 10px;
  font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
  color: #1a0402; background: var(--blood); border: 0; border-radius: 4px; padding: 10px 20px 9px;
  box-shadow: 0 3px 0 #5a0d06, 0 0 20px rgba(255, 84, 38, .3);
}
.zoom svg { width: 18px; height: 18px; flex: none; }
.zoom:active { transform: translateY(2px); box-shadow: 0 1px 0 #5a0d06; }
.zoom:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* Live badge on a stage */
.badge {
  position: absolute; transform: translate(-50%, -50%);
  width: max-content; max-width: 30%;
  display: grid; gap: 1px; justify-items: center; text-align: center;
  padding: .45em .7em .4em; border-radius: 5px;
  font-size: clamp(9px, 1.55vw, 17px); line-height: 1.05; color: var(--ink);
  background: rgba(0, 0, 0, .82); border: 1.5px solid var(--c);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 18px color-mix(in srgb, var(--c) 70%, transparent);
}
.zoomed .badge { font-size: clamp(12px, 2.8vw, 22px); }
/* Placed in the empty dark areas next to each stage's brush label, so no map icon is hidden */
/* Arcane hangs from just under its building, so a long name grows downwards;
   Station keeps its right edge next to the STATION label, so a long name grows leftwards. */
.badge[data-stage="arcane"] { --c: var(--arcane); left: 16%; top: 58.5%; transform: translateX(-50%); }
.badge[data-stage="station"] { --c: var(--station); left: 43%; top: 86%; transform: translate(-100%, -50%); }
.badge .k { display: flex; align-items: center; gap: .35em; font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: var(--c); filter: brightness(1.5); }
.badge .n { font-weight: 700; font-size: 1.15em; text-transform: uppercase; overflow-wrap: anywhere; }
.badge .t { font-size: .78em; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge.off { border-style: dashed; box-shadow: none; }
.dot { width: .6em; height: .6em; border-radius: 50%; background: var(--blood); flex: none; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 84, 38, .7); } 70%, 100% { box-shadow: 0 0 0 .6em rgba(255, 84, 38, 0); } }

footer { display: grid; gap: 10px; justify-items: center; color: var(--muted); font-size: 12px; letter-spacing: .06em; text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>Walking Bass</h1>
    <div class="meta">Samedi 31 octobre · 18h00 – 05h00</div>
  </header>

  <nav class="tabs" aria-label="Pages">
    <a href="./">Timetable</a>
    <a href="plan.html" aria-current="page">Plan</a>
  </nav>

  <div class="layout">
    <section style="display:grid;gap:8px" aria-label="Plan du festival">
      <div class="scroller" id="scroller">
        <div class="map">
          <img src="img/plan.webp" width="1358" height="1110" alt="Plan du festival : scène Arcane à gauche près de l'entrée, scène Station en bas au centre, bars, food trucks, WC, points d'eau et poste de secours entre les deux.">
          <div class="badge" data-stage="arcane"></div>
          <div class="badge" data-stage="station"></div>
        </div>
      </div>
      <button class="zoom" id="zoom" type="button" aria-pressed="false"></button>
    </section>
    <img class="legend" src="img/legende.webp" width="526" height="935" alt="Légende : casiers, bars, food trucks, cashless, points d'eau, Technobus, zone de jeux, WC et WC PSH, espaces dédiés PSH, poste de secours, stands VSSD et RDR, District (merchandising, make-up, studio photo).">
  </div>

  <footer>
    <div id="offline">Consultable hors ligne une fois installée.</div>
  </footer>
</div>

<script src="timetable.js"></script>
<script>
// --- one badge per stage: who is playing now, or who opens the night ---
const badges = document.querySelectorAll(".badge");
function render() {
  const m = nowMinutes();
  badges.forEach(b => {
    const stage = b.dataset.stage;
    const list = slots.filter(s => s.stage === stage);
    const cur = live(m) && list.find(s => m >= s.s && m < s.e);
    const first = list[0];
    b.classList.toggle("off", !cur);
    b.innerHTML = cur
      ? `<span class="k"><span class="dot"></span>${STAGES[stage]} · en direct</span><span class="n"></span><span class="t">jusqu'à ${fmt(cur.end)}</span>`
      : `<span class="k">${STAGES[stage]}</span><span class="n"></span><span class="t">dès ${fmt(first.start)}</span>`;
    b.querySelector(".n").textContent = (cur || first).name;
  });
}
render();
setInterval(render, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

// Phones: the whole map fits the width, "Agrandir" makes it wider and scrollable.
const scroller = document.getElementById("scroller");
const zoom = document.getElementById("zoom");
const ZOOM_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8M10.5 7.5v6M7.5 10.5h6"/></svg>Agrandir le plan';
const ZOOM_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8M7.5 10.5h6"/></svg>Réduire le plan';
zoom.innerHTML = ZOOM_IN;
zoom.addEventListener("click", () => {
  const on = scroller.classList.toggle("zoomed");
  zoom.setAttribute("aria-pressed", String(on));
  zoom.innerHTML = on ? ZOOM_OUT : ZOOM_IN;
  if (on) {
    scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
    scroller.scrollTop = (scroller.scrollHeight - scroller.clientHeight) / 2;
    scroller.scrollIntoView({ block: "start", behavior: "smooth" });
  }
});

// --- PWA: same service worker as the timetable ---
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      document.getElementById("offline").textContent = "Prêt pour le hors ligne : le plan reste consultable sans réseau.";
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
</script>

</body>
</html>
